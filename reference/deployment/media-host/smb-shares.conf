[agent-downloads]
   path = /srv/media/downloads/agent
   valid users = agent-media
   force user = mediaops
   read only = no
   browseable = no
   guest ok = no
   follow symlinks = no
   wide links = no
   smb encrypt = required
   hosts allow = 192.0.2.20 127.0.0.1
   hosts deny = ALL
   create mask = 0664
   directory mask = 0775

[agent-library]
   path = /srv/media/library
   valid users = agent-media
   force user = mediaops
   read only = no
   browseable = no
   guest ok = no
   follow symlinks = no
   wide links = no
   smb encrypt = required
   hosts allow = 192.0.2.20 127.0.0.1
   hosts deny = ALL
   create mask = 0664
   directory mask = 0775

name: agent-media
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: agent-gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_PROTOCOL: tcp
      OPENVPN_CUSTOM_CONFIG: /gluetun/provider.tcp.ovpn
      FIREWALL_INPUT_PORTS: "18080"
      TZ: Etc/UTC
    secrets: [openvpn_user, openvpn_password]
    ports: ["127.0.0.1:18080:18080/tcp"]
    volumes:
      - type: bind
        source: /srv/appdata/agent-media/gluetun
        target: /gluetun
        bind: {create_host_path: false}
    restart: "no"
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: agent-qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun: {condition: service_healthy, restart: true}
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: Etc/UTC
      WEBUI_PORT: "18080"
    volumes:
      - type: bind
        source: /srv/appdata/agent-media/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: /srv/media/downloads/agent
        target: /downloads
        bind: {create_host_path: false}
    restart: "no"
secrets:
  openvpn_user:
    file: ./secrets/openvpn_user
  openvpn_password:
    file: ./secrets/openvpn_password
